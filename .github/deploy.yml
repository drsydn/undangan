name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ubah ke branch yang Anda gunakan, misalnya 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'  # Ganti dengan versi Node.js yang sesuai jika perlu
    
    - name: Install dependencies
      run: npm install
    
    - name: Build the project
      run: npm run build
    
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: main  # Ubah ke branch yang Anda gunakan untuk deploy
        folder: dist  # Folder hasil build (misalnya 'dist')
